name: Keep Supabase alive

on:
  schedule:
    - cron: '0 0 */5 * *'  # 5일마다 자동 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            "https://gatlleexqvoizxomtaev.supabase.co/rest/v1/equipments?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "%{http_code}"
